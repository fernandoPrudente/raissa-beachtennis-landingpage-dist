name: Generate Pampulha responsive images

on:
  push:
    branches:
      - feature/aulas-beach-tennis-pampulha
    paths:
      - .github/workflows/generate-pampulha-responsive-images.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/aulas-beach-tennis-pampulha

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate responsive WebP crops and update picture markup
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source_path = Path("images/lagoa-pampulha-1200x807.png")
          source = Image.open(source_path).convert("RGB")

          variants = [
              (Path("images/lagoa-pampulha-640x480.webp"), (640, 480)),
              (Path("images/lagoa-pampulha-960x640.webp"), (960, 640)),
              (Path("images/lagoa-pampulha-1200x675.webp"), (1200, 675)),
          ]

          for output_path, size in variants:
              cropped = ImageOps.fit(
                  source,
                  size,
                  method=Image.Resampling.LANCZOS,
                  centering=(0.5, 0.5),
              )
              cropped.save(output_path, "WEBP", quality=80, method=6)
              print(f"generated {output_path}: {size[0]}x{size[1]} ({output_path.stat().st_size} bytes)")

          page_path = Path("aulas-beach-tennis-pampulha.html")
          html = page_path.read_text(encoding="utf-8")

          marker = 'srcset="images/lagoa-pampulha-1200x807.png"'
          marker_index = html.find(marker)
          if marker_index < 0:
              raise SystemExit("Lagoa image marker not found; refusing to modify the page.")

          picture_start = html.rfind("<picture>", 0, marker_index)
          picture_end = html.find("</picture>", marker_index)
          if picture_start < 0 or picture_end < 0:
              raise SystemExit("Lagoa <picture> block not found; refusing to modify the page.")
          picture_end += len("</picture>")

          line_start = html.rfind("\n", 0, picture_start) + 1
          indent = html[line_start:picture_start]
          new_lines = [
              "<picture>",
              indent + "  <source",
              indent + '    media="(max-width: 640px)"',
              indent + '    type="image/webp"',
              indent + '    srcset="images/lagoa-pampulha-640x480.webp"',
              indent + '    width="640"',
              indent + '    height="480"',
              indent + "  />",
              indent + "  <source",
              indent + '    media="(max-width: 1024px)"',
              indent + '    type="image/webp"',
              indent + '    srcset="images/lagoa-pampulha-960x640.webp"',
              indent + '    width="960"',
              indent + '    height="640"',
              indent + "  />",
              indent + "  <img",
              indent + '    src="images/lagoa-pampulha-1200x675.webp"',
              indent + '    alt="Lagoa da Pampulha em Belo Horizonte à noite"',
              indent + '    class="w-full object-cover"',
              indent + '    width="1200"',
              indent + '    height="675"',
              indent + '    loading="lazy"',
              indent + '    decoding="async"',
              indent + "  />",
              indent + "</picture>",
          ]
          new = "\n".join(new_lines)

          page_path.write_text(
              html[:picture_start] + new + html[picture_end:],
              encoding="utf-8",
          )
          PY

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aulas-beach-tennis-pampulha.html images/lagoa-pampulha-640x480.webp images/lagoa-pampulha-960x640.webp images/lagoa-pampulha-1200x675.webp
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Optimize Pampulha image for responsive screens"
            git push origin HEAD:feature/aulas-beach-tennis-pampulha
          fi
