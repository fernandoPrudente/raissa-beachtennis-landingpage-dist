name: Expand Pampulha area copy

on:
  push:
    branches:
      - feature/aulas-beach-tennis-pampulha
    paths:
      - .github/workflows/expand-pampulha-area-copy.yml

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/aulas-beach-tennis-pampulha

      - name: Expand service-area wording
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("aulas-beach-tennis-pampulha.html")
          html = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'content="Professora de Beach Tennis na Pampulha para aulas e treinamentos em quadras, condomínios, clubes e arenas. Para alunos com quadra definida e responsáveis por espaços esportivos."',
                  'content="Professora de Beach Tennis na Pampulha para aulas e treinamentos em quadras, condomínios, clubes e arenas, com atendimento também em outros bairros da região da Pampulha e áreas próximas, conforme agenda."'
              ),
              (
                  '              A proposta é atender alunos que já possuem acesso a uma quadra e\n              responsáveis por espaços esportivos que procuram uma professora de\n              Beach Tennis para atuar no local. Você informa onde fica a quadra;\n              a Raíssa verifica agenda e possibilidade de atendimento.',
                  '              A proposta é atender alunos que já possuem acesso a uma quadra e\n              responsáveis por espaços esportivos que procuram uma professora de\n              Beach Tennis para atuar no local. Os bairros destacados nesta página\n              são referências importantes da Pampulha, mas o atendimento não se\n              limita a eles: outras áreas da região da Pampulha e bairros próximos\n              também podem ser avaliados. Você informa onde fica a quadra; a Raíssa\n              verifica agenda e possibilidade de atendimento.'
              ),
              (
                  '            O atendimento em cada bairro depende da agenda da professora e da\n            disponibilidade e autorização de uso da quadra indicada. Consulte a\n            Raíssa antes de confirmar o treino.',
                  '            Os bairros acima são alguns destaques da região. Quadras localizadas\n            em outros bairros da Pampulha ou em bairros próximos também podem ser\n            atendidas, conforme agenda, distância, deslocamento e autorização de uso\n            do espaço. Consulte a Raíssa antes de confirmar o treino.'
              ),
              (
                  '                Minha quadra fica em Santa Amélia, Ouro Preto, Castelo ou perto da Fleming. Como verifico atendimento?',
                  '                Minha quadra fica em Santa Amélia, Ouro Preto, Castelo, perto da Fleming ou em outro bairro da Pampulha. Como verifico atendimento?'
              ),
              (
                  '                Envie o bairro, a identificação da quadra e a preferência de horário.\n                A professora confirma se há agenda e possibilidade de deslocamento até\n                o local antes de qualquer agendamento.',
                  '                Envie o bairro, a identificação da quadra e a preferência de horário.\n                Além dos bairros destacados nesta página, outras áreas da Pampulha e\n                bairros próximos também podem ser avaliados. A professora confirma se\n                há agenda e possibilidade de deslocamento até o local antes de qualquer\n                agendamento.'
              ),
          ]

          for old, new in replacements:
              if old not in html:
                  raise SystemExit(f"Expected text not found:\n{old[:140]}")
              html = html.replace(old, new, 1)

          path.write_text(html, encoding="utf-8")
          PY

      - name: Commit page changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aulas-beach-tennis-pampulha.html
          git commit -m "Expand Pampulha service area wording"
          git push origin HEAD:feature/aulas-beach-tennis-pampulha
