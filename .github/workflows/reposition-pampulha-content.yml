name: Reposition Pampulha content

on:
  push:
    branches:
      - feature/aulas-beach-tennis-pampulha
    paths:
      - .github/workflows/reposition-pampulha-content.yml

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/aulas-beach-tennis-pampulha

      - name: Reposition page content
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("aulas-beach-tennis-pampulha.html")
          html = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global html
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              html = html.replace(old, new, 1)

          def replace_count(old, new, expected, label):
              global html
              count = html.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} occurrences, found {count}")
              html = html.replace(old, new)

          replace_once(
              '    <title>Aulas de Beach Tennis na Pampulha, BH | Professora Raíssa</title>',
              '    <title>Professora de Beach Tennis para sua Quadra na Pampulha | Raíssa</title>',
              'title',
          )
          replace_once(
              '      content="Aulas de Beach Tennis na região da Pampulha, em Belo Horizonte, com a professora Raíssa Carvalho. Treinos para iniciantes, intermediários e praticantes que querem evoluir."',
              '      content="Professora de Beach Tennis na Pampulha para aulas e treinamentos em quadras, condomínios, clubes e arenas. Para alunos com quadra definida e responsáveis por espaços esportivos."',
              'meta description',
          )
          replace_once(
              '      content="aulas de beach tennis Pampulha, professora de beach tennis Pampulha, beach tennis Belo Horizonte, aula beach tennis Santa Amélia, beach tennis Avenida Fleming, beach tennis Ouro Preto BH"',
