              'meta keywords',
          )
          replace_once(
              '      content="Aulas de Beach Tennis na Pampulha, BH | Professora Raíssa"',
              '      content="Professora de Beach Tennis para sua Quadra na Pampulha | Raíssa"',
              'og title',
          )
          replace_once(
              '      content="Treine Beach Tennis na região da Pampulha, em Belo Horizonte, com acompanhamento da professora Raíssa Carvalho."',
              '      content="Já tem uma quadra ou administra um espaço de Beach Tennis na Pampulha? Leve aulas e treinamentos com a professora Raíssa Carvalho para o seu local."',
              'og description',
