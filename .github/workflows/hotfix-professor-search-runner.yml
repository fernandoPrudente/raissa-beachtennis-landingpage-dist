name: Run professor search SEO hotfix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/hotfix-professor-search-runner.yml

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Apply SEO hotfix
        run: python .github/hotfix-professor-search.py

      - name: Commit SEO hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sobre-raissa-carvalho.html aulas-beach-tennis-pampulha.html
          git diff --cached --check
          git commit -m "Hotfix SEO for professor Beach Tennis searches"
          git push origin HEAD:master
