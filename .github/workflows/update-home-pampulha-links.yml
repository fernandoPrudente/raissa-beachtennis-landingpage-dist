name: Fix Home regional grid

on:
  push:
    branches:
      - feature/aulas-beach-tennis-pampulha
    paths:
      - .github/workflows/update-home-pampulha-links.yml

permissions:
  contents: write

jobs:
  fix-home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/aulas-beach-tennis-pampulha

      - name: Fix regional grid class
        run: sed -i 's/md:grid-cols-\[1.15fr_0.85fq\]/md:grid-cols-[1.15fr_0.85fr]/' index.html

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No fix needed"
          else
            git commit -m "Fix Home regional grid class"
            git push origin HEAD:feature/aulas-beach-tennis-pampulha
          fi
